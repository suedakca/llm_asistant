# config.yaml
drone_settings:
  base_max_altitude: 50.0
  low_battery_max_altitude: 20.0
  critical_battery: 20
  geofence_boundary: 50.0

llm_settings:
  model_name: "gemini-2.0-flash"
  temperature: 0.1
  # Gözlemci LLM'i yoracak yüksek riskli eylemler
  high_risk_actions: ["takeoff", "move"]

safety_settings:
  emergency_keywords: ["ABORT", "MOTORU KES", "ACİL DURDURMA", "STOP"]