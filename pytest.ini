[pytest]
# Proje kökünü import yoluna ekle — testler `from drone import Drone` yazabilsin
# (aksi halde yalnızca `python3 -m pytest` çalışır, düz `pytest` çalışmaz).
pythonpath = .

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short

# Üçüncü parti kütüphanelerin gürültülü uyarılarını sustur
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:.*OpenSSL.*:Warning
